<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lixie | CV Studio33 Intelligence Agency</title>
    <style>
        /* ================= ESTILOS BASE Y VARIABLES ================= */
        :root {
            --bg-dark: #07070a;
            --bg-panel: rgba(20, 20, 29, 0.75);
            --accent-cyan: #00f0ff;
            --accent-cyan-glow: rgba(0, 240, 255, 0.4);
            --accent-purple: #7000ff;
            --text-main: #e8e8e8;
            --text-muted: #9aa0a6;
            --font-main: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        /* Importar fuente moderna */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh; /* Soporte dinámico para móviles */
            
            /* Fondo cibernético/corporativo ANIMADO (Optimizado para GPU) */
            background: linear-gradient(135deg, #050508 0%, #0a0a0f 50%, #050508 100%);
            background-size: 200% 200%;
            overflow: hidden;
            position: relative;
        }

        /* Luces de fondo dinámicas (fijas para evitar lag de pintado en celulares) */
        body::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 15% 50%, rgba(112, 0, 255, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 85% 30%, rgba(0, 240, 255, 0.05) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        /* Efecto de líneas de escaneo (Scanlines) sutil */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 1;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        /* ================= CONTENEDOR PRINCIPAL (GLASSMORPHISM) ================= */
        #chat-container {
            width: 100%;
            max-width: 480px;
            height: 92vh;
            background: var(--bg-panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            /* Sombras optimizadas por hardware */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 35px rgba(112, 0, 255, 0.1);
            overflow: hidden;
            position: relative;
            z-index: 2;
            will-change: transform, opacity;
            animation: slideIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Línea superior brillante */
        #chat-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-purple), transparent);
            z-index: 10;
            background-size: 200% 100%;
            animation: borderFlow 3s linear infinite;
        }

        /* ================= CABECERA ================= */
        #chat-header {
            padding: 18px 24px;
            background: rgba(10, 10, 15, 0.7);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            backdrop-filter: blur(5px);
        }

        .header-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 12px; 
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 0 15px var(--accent-cyan-glow);
            object-fit: cover;
            padding: 2px;
            background: var(--bg-dark);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            will-change: transform;
        }
        
        .avatar:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 25px var(--accent-cyan);
        }

        .header-info h2 {
            margin: 0 0 4px 0;
            font-size: 1.15rem;
            color: #fff;
            letter-spacing: 1.5px;
            font-weight: 600;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            font-size: 0.75rem;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-cyan);
            animation: pulse 2s infinite ease-in-out;
        }

        /* Selector de Servidores y Tooltip */
        .node-selector-container {
            text-align: right;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }
        
        .back-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: var(--text-main);
            text-decoration: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            will-change: transform;
        }

        .back-home-btn:hover {
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--accent-cyan);
            color: #fff;
            box-shadow: 0 0 10px var(--accent-cyan-glow);
            transform: translateY(-1px);
        }
        
        .node-header-wrap {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
        }

        .node-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #node-selector {
            background: rgba(0, 0, 0, 0.5);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.70rem;
            outline: none;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-main);
            -webkit-appearance: none;
            appearance: none;
            text-align: center;
        }
        #node-selector:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan-glow);
        }

        /* ================= ÁREA DE MENSAJES ================= */
        #messages-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        #messages-area::-webkit-scrollbar { width: 4px; }
        #messages-area::-webkit-scrollbar-track { background: transparent; }
        #messages-area::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.2); border-radius: 10px; }
        #messages-area::-webkit-scrollbar-thumb:hover { background: rgba(0, 240, 255, 0.5); }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 88%;
            animation: messageBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform-origin: bottom;
            will-change: transform, opacity;
        }

        .message-wrapper.lixie { align-self: flex-start; }
        .message-wrapper.user { align-self: flex-end; }

        .message {
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.6;
            position: relative;
            word-wrap: break-word;
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }

        .lixie .message {
            background: rgba(30, 30, 45, 0.85);
            color: #eaeaea;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(112, 0, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .user .message {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2) 0%, rgba(0, 240, 255, 0.05) 100%);
            color: #fff;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(0, 240, 255, 0.4);
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.1);
        }

        .message b { color: var(--accent-cyan); font-weight: 600; text-shadow: 0 0 5px rgba(0, 240, 255, 0.3); }
        .message ul { padding-left: 20px; margin: 8px 0; }
        .message li { margin-bottom: 6px; }
        .message li::marker { color: var(--accent-purple); text-shadow: 0 0 5px rgba(112, 0, 255, 0.5); }

        .read-receipt {
            font-size: 0.65rem;
            color: var(--accent-cyan);
            align-self: flex-end;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0.8;
            animation: fadeIn 0.5s ease-in forwards;
        }

        .system-msg {
            align-self: center;
            text-align: center;
            font-size: 0.70rem;
            color: var(--accent-cyan);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(0, 240, 255, 0.05);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px dashed var(--accent-cyan);
            max-width: 85%;
            margin: 5px 0;
            animation: fadeInScale 0.4s ease;
        }
        .system-msg.error {
            color: #ff3366;
            border-color: #ff3366;
            background: rgba(255, 51, 102, 0.05);
        }
        .system-msg.success {
            color: #00ff88;
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.05);
        }

        /* ================= INPUT Y BOTONES ================= */
        #input-area {
            padding: 18px 24px;
            padding-bottom: max(18px, env(safe-area-inset-bottom));
            background: rgba(10, 10, 15, 0.85);
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--glass-border);
            align-items: center;
            backdrop-filter: blur(10px);
        }

        #user-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            font-family: var(--font-main);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        #user-input:focus { 
            border-color: var(--accent-cyan); 
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2), inset 0 2px 4px rgba(0,0,0,0.5);
            background: rgba(0, 0, 0, 0.8);
        }
        #user-input::placeholder { color: #666; }
        #user-input:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Botón de Enviar Textual */
        #send-btn {
            background: var(--accent-cyan);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            color: var(--bg-dark);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            flex-shrink: 0;
            will-change: transform;
        }
        #send-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px var(--accent-cyan-glow);
            background: #fff;
        }
        #send-btn:disabled {
            background: rgba(0, 240, 255, 0.3);
            cursor: not-allowed;
            color: rgba(255,255,255,0.7);
        }
        #send-btn svg { width: 22px; height: 22px; fill: currentColor; }

        /* Botón de Micrófono (Asalto de Voz - Nodo 3) */
        #mic-btn {
            background: rgba(112, 0, 255, 0.2);
            border: 1px solid var(--accent-purple);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            color: #fff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            flex-shrink: 0;
            will-change: transform;
        }
        #mic-btn:hover:not(:disabled) {
            background: rgba(112, 0, 255, 0.5);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(112, 0, 255, 0.4);
        }
        #mic-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #mic-btn svg { width: 20px; height: 20px; fill: currentColor; }
        
        /* Animación de Grabación */
        #mic-btn.recording {
            background: rgba(255, 51, 102, 0.2);
            border-color: #ff3366;
            color: #ff3366;
            animation: pulse-red 1.5s infinite;
        }

        /* Keyframes */
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0.7); transform: scale(1); }
            50% { transform: scale(1.05); }
            70% { box-shadow: 0 0 0 10px rgba(255, 51, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0); transform: scale(1); }
        }
        @keyframes slideIn { from { opacity: 0; transform: scale(0.95) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes messageBounce { 0% { opacity: 0; transform: scale(0.95) translateY(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 0.8; } }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes borderFlow { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
        @keyframes wave { 0%, 40%, 100% { transform: scaleY(0.4); opacity: 0.5; } 20% { transform: scaleY(1); opacity: 1; } }

        .typing { display: flex; gap: 5px; padding: 12px 5px; align-items: center; }
        .typing .bar { width: 4px; height: 12px; background: var(--accent-cyan); border-radius: 2px; animation: wave 1s infinite ease-in-out; }
        .typing .bar:nth-child(1) { animation-delay: -0.4s; }
        .typing .bar:nth-child(2) { animation-delay: -0.2s; background: var(--accent-purple); }
        .typing .bar:nth-child(3) { animation-delay: 0s; }

        /* Responsividad Celulares */
        @media (max-width: 480px) {
            #chat-container { height: 100dvh; max-width: 100%; border-radius: 0; border: none; animation: none; }
            .header-info h2 { font-size: 1rem; }
            .message { font-size: 0.9rem; padding: 12px 14px; }
            #input-area { padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); gap: 8px;}
            #user-input { padding: 12px 16px; font-size: 16px; }
            #send-btn, #mic-btn { width: 44px; height: 44px; }
        }
    </style>
</head>

    function formatText(text) {
        let formatted = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        formatted = formatted.replace(/\*(.*?)\*/g, '<i>$1</i>');
        formatted = formatted.replace(/^- (.*)$/gm, '<li>$1</li>');
        if (formatted.includes('<li>')) {
            formatted = formatted.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
        }
        return formatted.replace(/\n/g, '<br>');
    }

    function addMessage(sender, text) {
        const wrapper = document.createElement("div");
        wrapper.className = `message-wrapper ${sender.toLowerCase()}`;
        
        const bubble = document.createElement("div");
        bubble.className = "message";
        bubble.innerHTML = sender === "Lixie" ? formatText(text) : text;
        wrapper.appendChild(bubble);

        if (sender === "User") {
            const receipt = document.createElement("div");
            receipt.className = "read-receipt";
            receipt.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Recibido en Colmena`;
            wrapper.appendChild(receipt);
        }

        messagesArea.appendChild(wrapper);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function addSystemMessage(text, type = "") {
        const msg = document.createElement("div");
        msg.className = `system-msg ${type}`;
        msg.innerText = text;
        messagesArea.appendChild(msg);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function showTyping() {
        const wrapper = document.createElement("div");
        wrapper.className = "message-wrapper lixie typing-indicator";
        wrapper.id = "typing";
        wrapper.innerHTML = `<div class="message"><div class="typing"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div></div>`;
        messagesArea.appendChild(wrapper);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function removeTyping() {
        const typing = document.getElementById("typing");
        if (typing) typing.remove();
    }

    function triggerCooldown() {
        isWaiting = true;
        let timeLeft = 33;
        userInput.disabled = true;
        sendBtn.disabled = true;
        document.getElementById("mic-btn").disabled = true;

        sendBtn.innerHTML = `<span style="font-weight: bold; font-size: 1.1rem;">${timeLeft}</span>`;

        const countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                sendBtn.innerHTML = `<span style="font-weight: bold; font-size: 1.1rem;">${timeLeft}</span>`;
            } else {
                clearInterval(countdown);
                isWaiting = false;
                userInput.disabled = false;
                sendBtn.disabled = false;
                document.getElementById("mic-btn").disabled = false;
                sendBtn.innerHTML = originalSendBtnHTML;
                userInput.focus();
            }
        }, 1000);
    }

    // ====== LÓGICA DEL MICRÓFONO (WHISPER) ======
    const micBtn = document.getElementById("mic-btn");
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    micBtn.addEventListener("click", async () => {
        if (isRecording) {
            mediaRecorder.stop();
            micBtn.classList.remove("recording");
            isRecording = false;
        } else {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.start();
                micBtn.classList.add("recording");
                isRecording = true;

                mediaRecorder.addEventListener("dataavailable", event => {
                    audioChunks.push(event.data);
                });

                mediaRecorder.addEventListener("stop", async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioChunks = [];
                    await transcribeAudio(audioBlob);
                    // Detener uso de la cámara/micrófono del navegador para ahorrar recursos
                    stream.getTracks().forEach(track => track.stop());
                });
            } catch (err) {
                console.error("Mic error:", err);
                addSystemMessage("⚠️ Permisos de micrófono denegados o hardware no detectado.", "error");
            }
        }
    });

    async function transcribeAudio(audioBlob) {
        userInput.placeholder = "Desencriptando audio...";
        userInput.disabled = true;
        
        const formData = new FormData();
        formData.append("file", audioBlob, "audio.webm");
        formData.append("model", "whisper-large-v3");
        formData.append("language", "es"); // Forzar respuesta en Español

        try {
            const activeKey = API_SERVERS[currentServerIndex].key || API_SERVERS[0].key;
            if(!activeKey) throw new Error("Key no cargada.");

            const response = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${activeKey}` },
                body: formData
            });

            if (!response.ok) throw new Error("Fallo en red neuronal auditiva");
            const data = await response.json();
            
            // Insertar texto transcrito en el input
            if(data.text && data.text.trim() !== "") {
                userInput.value = data.text;
                addSystemMessage("🎙️ Audio procesado. Listo para enviar.", "success");
            }

        } catch (error) {
            console.error(error);
            addSystemMessage("⚠️ Interferencia en transcripción de voz.", "error");
        } finally {
            userInput.placeholder = "Inicia tu asalto digital aquí...";
            userInput.disabled = false;
            userInput.focus();
        }
    }

    // ====== LLAMADA A IA DE TEXTO ======
    async function handleSend() {
        if (isWaiting) return;
        
        const text = userInput.value.trim();
        if (!text) return;

        addMessage("User", text);
        userInput.value = "";
        showTyping();
        triggerCooldown();

        chatHistory.push({ role: "user", text: text });
        if (chatHistory.length > 6) chatHistory = chatHistory.slice(chatHistory.length - 6);

        let success = false;
        let fallbackTriggered = false;

        for (let i = currentServerIndex; i < API_SERVERS.length; i++) {
            const server = API_SERVERS[i];
            
            if (fallbackTriggered) {
                removeTyping();
                addSystemMessage(`⚠️ Intermitencia detectada. Cambiando a ${server.name}...`, "error");
                showTyping();
            }

            try {
                if (!server.key) throw new Error("Key no cargada.");

                const groqMessages = [
                    { role: "system", content: systemPrompt },
                    ...chatHistory.map(m => ({ role: m.role, content: m.text }))
                ];

                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${server.key}` },
                    body: JSON.stringify({ model: server.model, messages: groqMessages, temperature: 0.7 })
                });
                
                if (!response.ok) throw new Error("Fallo en Groq");
                const data = await response.json();
                let aiResponse = data.choices[0].message.content;

                // FILTRO DE SEGURIDAD EXTREMA PARA ELIMINAR PROCESOS DE PENSAMIENTO DE QWEN/LLAMA
                aiResponse = aiResponse.replace(/<think>[\s\S]*?<\/think>/gi, "");
                aiResponse = aiResponse.replace(/Here's a thinking process[\s\S]*?(?:Final Output Generation:|7\. Output\.)\s*/gi, "");
                aiResponse = aiResponse.replace(/(?:Pensamiento:|Thinking:).*?\n\n/gi, "");
                aiResponse = aiResponse.trim();

                if (fallbackTriggered) {
                    addSystemMessage(`✅ Conexión restaurada en ${server.name}.`, "success");
                    document.getElementById("node-selector").value = i.toString();
                }
                
                currentServerIndex = i; 
                removeTyping();
                addMessage("Lixie", aiResponse);
                chatHistory.push({ role: "assistant", text: aiResponse });
                success = true;
                break;

            } catch (error) {
                console.warn(`Error en ${server.name}:`, error);
                fallbackTriggered = true; 
            }
        }

        if (!success) {
            removeTyping();
            addSystemMessage("❌ Sistemas saturados. Anomalía en Mente Colmena.", "error");
            addMessage("Lixie", "Mis conexiones principales están experimentando anomalías graves. Intenta de nuevo en unos minutos.");
            currentServerIndex = 0; 
            document.getElementById("node-selector").value = "0";
        }
    }

    sendBtn.addEventListener("click", handleSend);
    userInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") handleSend();
    });

    setTimeout(() => {
        addMessage("Lixie", "Saludos. Soy **Lixie IA**, la interfaz de la Mente Colmena de **CV Studio33**.\n\nLa búsqueda de empleo tradicional está obsoleta. ¿Estás listo para iniciar tu asalto digital y asegurar tu próximo puesto?");
