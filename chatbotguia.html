<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lixie | CV Studio33 Intelligence Agency</title>
    <style>
        /* ================= ESTILOS BASE Y VARIABLES ================= */
        :root {
            --bg-dark: #07070a;
            --bg-panel: rgba(20, 20, 29, 0.75);
            --accent-cyan: #00f0ff;
            --accent-cyan-glow: rgba(0, 240, 255, 0.4);
            --accent-purple: #7000ff;
            --text-main: #e8e8e8;
            --text-muted: #9aa0a6;
            --font-main: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        /* Importar fuente moderna */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh; /* Soporte dinámico para móviles */
            
            /* Fondo cibernético/corporativo ANIMADO (Optimizado: sin animación constante) */
            background: linear-gradient(135deg, #050508 0%, #0a0a0f 50%, #050508 100%);
            background-size: 200% 200%;
            overflow: hidden;
            position: relative;
        }

        /* Luces de fondo dinámicas (Optimizado: fijas para evitar lag de pintado) */
        body::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 15% 50%, rgba(112, 0, 255, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 85% 30%, rgba(0, 240, 255, 0.05) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        /* Efecto de líneas de escaneo (Scanlines) sutil */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 1;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        /* ================= CONTENEDOR PRINCIPAL (GLASSMORPHISM) ================= */
        #chat-container {
            width: 100%;
            max-width: 480px;
            height: 92vh;
            background: var(--bg-panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            /* Optimizado: Sombra fija pero vibrante para evitar caída de FPS */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 35px rgba(112, 0, 255, 0.1);
            overflow: hidden;
            position: relative;
            z-index: 2;
            animation: slideIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Línea superior brillante */
        #chat-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-purple), transparent);
            z-index: 10;
            background-size: 200% 100%;
            animation: borderFlow 3s linear infinite;
        }

        /* ================= CABECERA ================= */
        #chat-header {
            padding: 18px 24px;
            background: rgba(10, 10, 15, 0.6);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .header-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 12px; /* Corte más tecnológico que redondo */
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 0 15px var(--accent-cyan-glow);
            object-fit: cover;
            padding: 2px;
            background: var(--bg-dark);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
        }
        
        .avatar:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 25px var(--accent-cyan);
        }

        .header-info h2 {
            margin: 0 0 4px 0;
            font-size: 1.15rem;
            color: #fff;
            letter-spacing: 1.5px;
            font-weight: 600;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            font-size: 0.75rem;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-cyan);
            animation: pulse 2s infinite ease-in-out;
        }

        /* Selector de Servidores y Tooltip */
        .node-selector-container {
            text-align: right;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }
        
        /* Botón de volver al inicio */
        .back-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: var(--text-main);
            text-decoration: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .back-home-btn:hover {
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--accent-cyan);
            color: #fff;
            box-shadow: 0 0 10px var(--accent-cyan-glow);
            transform: translateY(-1px);
        }
        
        .node-header-wrap {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
        }

        .node-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-icon {
            color: var(--accent-purple);
            font-size: 0.7rem;
            cursor: help;
            border: 1px solid var(--accent-purple);
            border-radius: 50%;
            width: 14px;
            height: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .info-icon:hover {
            background: var(--accent-purple);
            color: #fff;
            box-shadow: 0 0 10px rgba(112, 0, 255, 0.5);
            transform: scale(1.1);
        }

        /* Tooltip de explicación de Servidores */
        .tooltip-text {
            visibility: hidden;
            width: 200px;
            background-color: rgba(10, 10, 15, 0.95);
            color: #ccc;
            text-align: left;
            border-radius: 8px;
            padding: 10px;
            position: absolute;
            z-index: 100;
            top: 100%;
            right: 0;
            font-size: 0.7rem;
            border: 1px solid var(--glass-border);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            transform: translateY(5px);
            line-height: 1.4;
        }
        .node-header-wrap:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
            transform: translateY(0);
        }

        #node-selector {
            background: rgba(0, 0, 0, 0.5);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.70rem;
            outline: none;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-main);
        }
        #node-selector:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan-glow);
        }

        /* ================= ÁREA DE MENSAJES ================= */
        #messages-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* Scrollbar personalizada */
        #messages-area::-webkit-scrollbar { width: 6px; }
        #messages-area::-webkit-scrollbar-track { background: transparent; }
        #messages-area::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        #messages-area::-webkit-scrollbar-thumb:hover { background: rgba(0, 240, 255, 0.3); }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 88%;
            animation: messageBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform-origin: bottom;
        }

        .message-wrapper.lixie { align-self: flex-start; }
        .message-wrapper.user { align-self: flex-end; }

        .message {
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.6;
            position: relative;
            word-wrap: break-word;
            transition: all 0.3s ease;
        }

        .message:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            transform: translateY(-2px);
        }

        .lixie .message {
            background: rgba(30, 30, 45, 0.6);
            color: #eaeaea;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(112, 0, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .user .message {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15) 0%, rgba(0, 240, 255, 0.05) 100%);
            color: #fff;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.05);
        }

        /* Estilos de texto interno */
        .message b { color: var(--accent-cyan); font-weight: 600; text-shadow: 0 0 5px rgba(0, 240, 255, 0.3); }
        .message ul { padding-left: 20px; margin: 8px 0; }
        .message li { margin-bottom: 6px; }
        .message li::marker { color: var(--accent-purple); text-shadow: 0 0 5px rgba(112, 0, 255, 0.5); }

        /* ========= BOTONES DE ACCIÓN (MANTENIDOS COMO LEGACY, PERO NO ACTIVADOS POR LA IA) ========= */
        .action-btn {
            display: block;
            margin: 12px 0 4px 0;
            padding: 10px 15px;
            background: linear-gradient(90deg, rgba(112, 0, 255, 0.2), rgba(0, 240, 255, 0.1));
            border: 1px solid var(--accent-cyan);
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .action-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-20deg);
            transition: 0.5s;
        }

        .action-btn:hover::before {
            left: 150%;
        }

        .action-btn:hover {
            background: linear-gradient(90deg, rgba(112, 0, 255, 0.4), rgba(0, 240, 255, 0.3));
            box-shadow: 0 0 20px var(--accent-cyan-glow);
            transform: translateY(-3px) scale(1.02);
            color: #fff;
        }

        .read-receipt {
            font-size: 0.65rem;
            color: var(--accent-cyan);
            align-self: flex-end;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0.8;
            animation: fadeIn 0.5s ease-in forwards;
        }

        /* ===== MENSAJES DEL SISTEMA (FAILOVER) ===== */
        .system-msg {
            align-self: center;
            text-align: center;
            font-size: 0.70rem;
            color: var(--accent-cyan);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(0, 240, 255, 0.05);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px dashed var(--accent-cyan);
            max-width: 85%;
            margin: 5px 0;
            animation: fadeInScale 0.4s ease;
        }
        .system-msg.error {
            color: #ff3366;
            border-color: #ff3366;
            background: rgba(255, 51, 102, 0.05);
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.2);
        }
        .system-msg.success {
            color: #00ff88;
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.05);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        /* ================= INPUT ================= */
        #input-area {
            padding: 18px 24px;
            padding-bottom: max(18px, env(safe-area-inset-bottom)); /* Levanta el input en iOS/Android nativos */
            background: rgba(10, 10, 15, 0.8);
            display: flex;
            gap: 12px;
            border-top: 1px solid var(--glass-border);
            align-items: center;
        }

        #user-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-family: var(--font-main);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        #user-input:focus { 
            border-color: var(--accent-cyan); 
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2), inset 0 2px 4px rgba(0,0,0,0.5);
            background: rgba(0, 0, 0, 0.7);
            transform: translateY(-2px);
        }
        #user-input::placeholder { color: #555; transition: color 0.3s; }
        #user-input:focus::placeholder { color: #888; }
        #user-input:disabled { opacity: 0.5; cursor: not-allowed; }

        #send-btn {
            background: var(--accent-cyan);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            color: var(--bg-dark);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        #send-btn::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 100%; height: 100%; background: rgba(255,255,255,0.2);
            border-radius: 50%; transform: translate(-50%, -50%) scale(0);
            opacity: 0; transition: transform 0.4s, opacity 0.4s;
        }
        #send-btn:active::after {
            transform: translate(-50%, -50%) scale(2); opacity: 1; transition: 0s;
        }
        #send-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.08);
            box-shadow: 0 8px 25px var(--accent-cyan-glow);
            background: #fff;
        }
        #send-btn:active:not(:disabled) {
            transform: translateY(0) scale(0.95);
        }
        #send-btn:disabled {
            background: rgba(0, 240, 255, 0.3);
            cursor: not-allowed;
            color: rgba(255,255,255,0.7);
        }
        #send-btn svg { width: 22px; height: 22px; fill: currentColor; transition: transform 0.3s; }
        #send-btn:hover:not(:disabled) svg { transform: translateX(3px) translateY(-3px); }

        /* Animaciones Optimizadas (Eliminadas las que causaban lag masivo de renderizado) */
        @keyframes slideIn { from { opacity: 0; transform: scale(0.92) translateY(40px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }
        @keyframes messageBounce { 0% { opacity: 0; transform: scale(0.9) translateY(20px); } 70% { transform: scale(1.02) translateY(-2px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        /* Optimizada: Solo anima la opacidad, la sombra ya la hereda la clase base, ahorrando carga de GPU */
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 0.8; } }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes borderFlow { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

        /* Typing indicator tech */
        .typing { display: flex; gap: 5px; padding: 12px 5px; align-items: center; }
        .typing .bar { width: 4px; height: 12px; background: var(--accent-cyan); border-radius: 2px; animation: wave 1s infinite ease-in-out; }
        .typing .bar:nth-child(1) { animation-delay: -0.4s; }
        .typing .bar:nth-child(2) { animation-delay: -0.2s; background: var(--accent-purple); }
        .typing .bar:nth-child(3) { animation-delay: 0s; }
        @keyframes wave { 0%, 40%, 100% { transform: scaleY(0.4); opacity: 0.5; } 20% { transform: scaleY(1); opacity: 1; } }

        /* Responsividad Mejorada */
        @media (max-width: 480px) {
            #chat-container { 
                height: 100dvh; 
                max-width: 100%; 
                border-radius: 0; 
                border: none; 
                animation: none; 
            }
            .header-info h2 { font-size: 1rem; }
            .message { font-size: 0.9rem; padding: 12px 14px; }
            #input-area { 
                padding: 12px 16px;
                padding-bottom: max(12px, env(safe-area-inset-bottom));
            }
            #user-input { padding: 12px 16px; font-size: 16px; }
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat-header">
        <div class="header-profile">
            <img src="chatbotcv.png" alt="Lixie Avatar" class="avatar" onerror="this.src='https://via.placeholder.com/256/00f0ff/0a0a0f?text=LX'">
            <div class="header-info">
                <h2>Lixie AI</h2>
                <div class="status"><div class="status-dot"></div> Mente Colmena Activa</div>
            </div>
        </div>
        <div class="node-selector-container">
            <a href="https://protocololeviatham.github.io/cvstudio33/index.html" class="back-home-btn">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                Inicio
            </a>
            
            <div class="node-header-wrap">
                <span class="node-label">Servidores Activos</span>
                <span class="info-icon">i</span>
                <div class="tooltip-text">
                    <b>¿Para qué sirven los Servidores?</b><br>
                    El sistema escala automáticamente. Si la IA no responde, cambiará de servidor en cascada (Groq > Gemini > Groq) para restaurar la comunicación inmediatamente.
                </div>
            </div>
            <!-- SE CONFIGURÓ PARA 3 NODOS -->
            <select id="node-selector">
                <option value="0">Servidor 1 (Principal)</option>
                <option value="1">Servidor 2 (Respaldo)</option>
                <option value="2">Servidor 3 (Emergencia)</option>
            </select>
        </div>
    </div>

    <div id="messages-area">
        <!-- Los mensajes se renderizan aquí -->
    </div>

    <!-- EL DIV DE FAQS FUE ELIMINADO COMO SE SOLICITÓ PARA EVITAR ERRORES -->

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Inicia tu asalto digital aquí..." autocomplete="off">
        <button id="send-btn">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
</div>

<script type="module">
    // IMPORTACIÓN DE FIREBASE (Seguridad de Mente Colmena)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // Configuración de Firebase Cloud
    const firebaseConfig = {
      apiKey: "AIzaSyDbPAgKs2_L4NTafhyDUW0Ui_U5aRL5728",
      authDomain: "cv-studio33.firebaseapp.com",
      projectId: "cv-studio33",
      storageBucket: "cv-studio33.firebasestorage.app",
      messagingSenderId: "189453088234",
      appId: "1:189453088234:web:639c130a6287ff34122e93"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 1. CONFIGURACIÓN DEL ESCALADO DE SERVIDORES (FAILOVER AUTOMÁTICO A 3 NODOS)
    // Modelos Groq actualizados según la documentación solicitada
    const API_SERVERS = [
        { type: "groq", key: "", model: "meta-llama/llama-prompt-guard-2-22m", name: "Servidor 1 (Groq Principal)" },
        { type: "gemini", key: "", model: "gemini-1.5-flash-latest", name: "Servidor 2 (Gemini Respaldo)" },
        { type: "groq", key: "", model: "meta-llama/llama-prompt-guard-2-22m", name: "Servidor 3 (Groq Emergencia)" }
    ];

    // Función para obtener las claves desde Cloud Firestore (Mapeo a key1, key2 y key3)
    async function loadSecureKeys() {
        try {
            const docRef = doc(db, "chatbotcv", "IDCV");
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                API_SERVERS[0].key = data.key1;
                API_SERVERS[1].key = data.key2;
                API_SERVERS[2].key = data.key3;
                console.log("🔒 Protocolo de Seguridad: Claves de la Colmena sincronizadas correctamente.");
            } else {
                console.error("⚠️ Error de Colmena: Documento IDCV no encontrado en la base de datos.");
            }
        } catch (error) {
            console.error("⚠️ Error de Colmena al intentar recuperar las credenciales:", error);
        }
    }

    // Inicializamos la búsqueda de claves al arrancar
    loadSecureKeys();

    let currentServerIndex = 0; // Empieza siempre por el Servidor 1
    
    // Conectar el selector manual a la variable del servidor
    document.getElementById("node-selector").addEventListener("change", (e) => {

    // 4. LÓGICA DE INTERFAZ Y CHAT
    
    // (SE ELIMINARON LOS BOTONES FAQ PARA EVITAR ERRORES DE RENDERIZADO Y CONFLICTOS)

    function formatText(text) {
        // Se mantiene la función de formateo limpia, por si quedan rezagos, pero la IA está instruida a no mandar Markdown
        let formatted = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank" class="action-btn">$1</a>');
        formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        formatted = formatted.replace(/\*(.*?)\*/g, '<i>$1</i>');
        formatted = formatted.replace(/^- (.*)$/gm, '<li>$1</li>');
        if (formatted.includes('<li>')) {
            formatted = formatted.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
        }
        return formatted.replace(/\n/g, '<br>');
    }

    function addMessage(sender, text) {
        const wrapper = document.createElement("div");
        wrapper.className = `message-wrapper ${sender.toLowerCase()}`;
        
        const bubble = document.createElement("div");
        bubble.className = "message";
        bubble.innerHTML = sender === "Lixie" ? formatText(text) : text;
        
        wrapper.appendChild(bubble);

        if (sender === "User") {
            const receipt = document.createElement("div");
            receipt.className = "read-receipt";
            receipt.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Recibido en Colmena`;
            wrapper.appendChild(receipt);
        }

        messagesArea.appendChild(wrapper);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function addSystemMessage(text, type = "") {
        const msg = document.createElement("div");
        msg.className = `system-msg ${type}`;
        msg.innerText = text;
        messagesArea.appendChild(msg);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function showTyping() {
        const wrapper = document.createElement("div");
        wrapper.className = "message-wrapper lixie typing-indicator";
        wrapper.id = "typing";
        wrapper.innerHTML = `<div class="message"><div class="typing"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div></div>`;
        messagesArea.appendChild(wrapper);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function removeTyping() {
        const typing = document.getElementById("typing");
        if (typing) typing.remove();
    }

    // Sistema de Enfriamiento (Cooldown de 33 segundos)
    function triggerCooldown() {
        isWaiting = true;
        let timeLeft = 33;
        
        userInput.disabled = true;
        sendBtn.disabled = true;
        // Los FAQ se eliminaron, así que no necesitamos deshabilitarlos aquí

        sendBtn.innerHTML = `<span style="font-weight: bold; font-size: 1.1rem;">${timeLeft}</span>`;

        const countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                sendBtn.innerHTML = `<span style="font-weight: bold; font-size: 1.1rem;">${timeLeft}</span>`;
            } else {
                clearInterval(countdown);
                isWaiting = false;
                userInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.innerHTML = originalSendBtnHTML;
                userInput.focus();
            }
        }, 1000);
    }

    // 5. LLAMADA MULTI-API CON FAILOVER (CASCADA)
    async function handleSend() {
        if (isWaiting) return;
        
        const text = userInput.value.trim();
        if (!text) return;

        addMessage("User", text);
        userInput.value = "";
        showTyping();
        
        triggerCooldown();

        // Almacenamiento unificado
        chatHistory.push({ role: "user", text: text });
        if (chatHistory.length > 6) { chatHistory = chatHistory.slice(chatHistory.length - 6); }

        let success = false;
        let fallbackTriggered = false;

        // Bucle de Escalado de Servidores (Failover ajustado a los 3 nodos)
        for (let i = currentServerIndex; i < API_SERVERS.length; i++) {
            const server = API_SERVERS[i];
            
            if (fallbackTriggered) {
                removeTyping();
                addSystemMessage(`⚠️ Intermitencia detectada. Cambiando de servidor a ${server.name}...`, "error");
                showTyping();
            }

            try {
                // Verificar que la llave existe antes de disparar a la API
                if (!server.key || server.key === "") {
                    throw new Error("Key no cargada desde Firestore aún.");
                }

                let aiResponse = "";
                
                // Formateo y Fetch dinámico según el tipo de API
                if (server.type === "groq") {
                    const groqMessages = [
                        { role: "system", content: systemPrompt },
                        ...chatHistory.map(m => ({ role: m.role === "assistant" ? "assistant" : "user", content: m.text }))
                    ];

                    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${server.key}` },
                        // Temperatura y parametros adaptados sin romper la lógica del fetch JSON
                        body: JSON.stringify({ model: server.model, messages: groqMessages, temperature: 0.7 })
                    });
                    
                    if (!response.ok) throw new Error("Fallo en Groq");
                    const data = await response.json();
                    aiResponse = data.choices[0].message.content;

                } else if (server.type === "gemini") {
                    const geminiContents = chatHistory.map(m => ({
                        role: m.role === "assistant" ? "model" : "user",
                        parts: [{ text: m.text }]
                    }));
                    
                    const geminiPayload = {
                        system_instruction: { parts: [{ text: systemPrompt }] },
                        contents: geminiContents
                    };

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${server.model}:generateContent?key=${server.key}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(geminiPayload)
                    });

                    if (!response.ok) throw new Error("Fallo en Gemini");
                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);
                    aiResponse = data.candidates[0].content.parts[0].text;
                }

                // SI EL FETCH ES EXITOSO
                if (fallbackTriggered) {
                    addSystemMessage(`✅ Cambio exitoso. Conexión restaurada en ${server.name}.`, "success");
                    // Actualizamos el selector visual para que coincida con el servidor activo
                    document.getElementById("node-selector").value = i.toString();
                }
                
                currentServerIndex = i; // Guardamos el servidor que funcionó para la próxima vez
                removeTyping();
                addMessage("Lixie", aiResponse);
                chatHistory.push({ role: "assistant", text: aiResponse });
                success = true;
                break; // Rompemos el bucle porque ya funcionó

            } catch (error) {
                console.warn(`Error conectando con ${server.name}:`, error);
                fallbackTriggered = true; // Si falla, activamos el flag para el siguiente ciclo
            }
        }

        // Si recorrió todos los servidores y ninguno funcionó
        if (!success) {
            removeTyping();
            addSystemMessage("❌ Fallo crítico en todos los servidores de la Mente Colmena. Los sistemas están saturados.", "error");
            addMessage("Lixie", "Lo lamento, pero actualmente mis conexiones principales están experimentando anomalías graves. Por favor, intenta de nuevo en unos minutos.");
            currentServerIndex = 0; // Reiniciamos al nodo 1 para el futuro
            document.getElementById("node-selector").value = "0";
        }
    }

    sendBtn.addEventListener("click", handleSend);
    userInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") handleSend();
    });

    setTimeout(() => {
